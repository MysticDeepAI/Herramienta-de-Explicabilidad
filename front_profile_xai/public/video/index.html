<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video de bloques XAI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Plan: escenario crema luminoso (el "video"), bloque modelo en carbón, bloque explicación en granate, rosa como luz.
   Display: Bricolage Grotesque · Texto: DM Sans · Datos: JetBrains Mono. Una sola idea en pantalla a la vez. */
:root{--bg:#F6F1F2;--fg:#1B1216;--muted:#6C5B62;--line:#DDD0D4;--accent:#8B1D3B;--panel:#fff;--accent-fg:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#150D11;--fg:#F4EAED;--muted:#A8949B;--line:#33232A;--accent:#E0607F;--panel:#1E1318;--accent-fg:#1A0E14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150D11;--fg:#F4EAED;--muted:#A8949B;--line:#33232A;--accent:#E0607F;--panel:#1E1318;--accent-fg:#1A0E14;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(22px,3.6vw,30px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted)}
.player{display:flex;flex-direction:column;gap:12px;outline:none}
.stage{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;container-type:inline-size;
  background:radial-gradient(90% 90% at 50% 35%,#FFFDF9 0%,#F6EEE4 60%,#EDE1D3 100%)}
.player:focus-visible .stage{box-shadow:0 0 0 3px var(--accent)}
svg#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
svg text{font-family:'DM Sans',sans-serif}
.capwrap{position:absolute;left:0;right:0;bottom:2.2cqw;display:flex;justify-content:center;pointer-events:none;padding:0 4cqw}
.cap{font-size:max(12px,2cqw);line-height:1.3;text-align:center;background:rgba(27,18,22,.78);color:#fff;padding:.7cqw 1.8cqw;border-radius:1cqw;opacity:0;transition:opacity .3s;max-width:80cqw}
.cap.on{opacity:1}
.soundchip{position:absolute;top:2cqw;right:2cqw;z-index:3;display:inline-flex;align-items:center;gap:.7cqw;font:inherit;font-weight:700;font-size:max(11px,1.45cqw);color:#fff;background:rgba(27,18,22,.82);border:0;border-radius:99cqw;padding:.8cqw 1.6cqw;cursor:pointer}
.soundchip svg{width:1.8cqw;min-width:14px;height:1.8cqw;min-height:14px}
.soundchip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted)}
.opts select{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.ctrl{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn svg{width:18px;height:18px}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:86px;text-align:center}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:24px}
@media (max-width:560px){.ctrl{flex-wrap:wrap}.ctrl input[type=range]{order:5;flex-basis:100%}}

body{margin:0}
[hidden]{display:none!important}
:root.embed{--bg:transparent;--fg:#1B1216;--muted:#6C5B62;--line:#DDD0D4;--accent:#8B1D3B;--panel:#fff;--accent-fg:#fff;color-scheme:light}
.embed body{padding:0;background:transparent}
.embed header{display:none}
.embed .wrap{max-width:none;gap:12px}
</style>

<div class="wrap">
  <header>
    <h1>La IA decide. Este bloque explica por qué.</h1>
    <p class="lead">Animación de 56 segundos para cualquier público.</p>
  </header>

  <div class="player" id="player" tabindex="0" aria-label="Reproductor. Espacio pausa o reanuda, flechas avanzan o retroceden.">
    <div class="stage" id="stage">
      <svg id="svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="Animación: un bloque gris es el modelo de IA y entrega un resultado sin explicación; un bloque granate de explicación se acopla a él, abre su interior, muestra qué datos pesaron más y lo cuenta en lenguajes distintos para distintos públicos.">
        <defs>
          <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
          <filter id="card" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A0C1B" flood-opacity=".18"/></filter>
        </defs>
        <g id="cam"><g id="world"></g></g>
        <g id="ui"></g>
      </svg>
      <button class="soundchip" id="soundchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Activar sonido</button>
      <div class="capwrap"><div class="cap" id="cap" aria-hidden="true"></div></div>
    </div>

    <div class="ctrl">
      <button class="btn main" id="play" aria-label="Pausar"><svg viewBox="0 0 24 24" fill="currentColor" id="icoPause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg viewBox="0 0 24 24" fill="currentColor" id="icoPlay" hidden><path d="M7 5v14l12-7z"/></svg></button>
      <button class="btn" id="replay" aria-label="Ver de nuevo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <input type="range" id="seek" min="0" max="56" step="0.01" value="0" aria-label="Posición del video">
      <span class="time" id="time">0:00 / 0:56</span>
      <button class="btn" id="voice" aria-pressed="false" title="Lee los subtítulos en voz alta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Voz</button>
      <button class="btn" id="music" aria-pressed="false" title="Música de fondo suave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Música</button>
      <button class="btn" id="full" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="opts" id="opts" hidden><label for="voiceSel">Voz</label><select id="voiceSel" aria-label="Elegir voz"></select>
      <span>No se pudo cargar la narración grabada, así que se usa la voz de tu dispositivo.</span></div>
  </div>
</div>

<script>
(function(){
  var TOTAL = 56;
  var CAPS = [
    {a:0.6,  b:7.6,  t:'Las inteligencias artificiales ya ayudan a tomar decisiones, pero casi nunca explican por qué.'},
    {a:8.4,  b:15.6, t:'Esta herramienta es el complemento del modelo: un bloque que se acopla y traduce su lógica.'},
    {a:16.6, b:26.4, t:'Muestra qué datos pesaron más y lo explica según el tipo de usuario.'},
    {a:27.6, b:33.8, t:'Para especialistas, expertos del área o cualquier persona.'},
    {a:35.6, b:43.4, t:'Para configurarlo necesitas tres cosas: el modelo con sus pesos, una parte de tus datos y una base de conocimiento.'},
    {a:44.2, b:50.4, t:'Después, agrega los casos que quieras analizar: desde uno hasta varios.'},
    {a:51.4, b:55.6, t:'Entiende por qué decide la IA.'}
  ];

  var NS='http://www.w3.org/2000/svg', C=0.8660254, S=0.5;
  var $=function(id){return document.getElementById(id)};
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  function P(x,y,z){return [(x-y)*C,(x+y)*S-z]}
  function pts(a){return a.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
  function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

  function prism(parent,o){
    var w=o.w,d=o.d,h=o.h,x0=-w/2,x1=w/2,y0=-d/2,y1=d/2,sk=o.stroke||'rgba(255,255,255,.14)';
    var g=el('g',{},parent), f={};
    var L=[P(x0,y1,h),P(x1,y1,h),P(x1,y1,0),P(x0,y1,0)];
    var R=[P(x1,y1,h),P(x1,y0,h),P(x1,y0,0),P(x1,y1,0)];
    var T=[P(x0,y0,h),P(x1,y0,h),P(x1,y1,h),P(x0,y1,h)];
    var base={'stroke':sk,'stroke-width':1.5,'stroke-linejoin':'round','fill-opacity':1};
    f.left =el('polygon',Object.assign({points:pts(L),fill:o.left},base),g);
    f.right=el('polygon',Object.assign({points:pts(R),fill:o.right},base),g);
    f.top  =el('polygon',Object.assign({points:pts(T),fill:o.top},base),g);
    return {g:g,f:f};
  }
  function slotFor(parent,X,Y,w,d){
    var p=P(X,Y,0), slot=el('g',{},parent);
    gsap.set(slot,{x:p[0],y:p[1]-12});
    var sh=el('polygon',{points:pts([P(-w/2,-d/2,0),P(w/2,-d/2,0),P(w/2,d/2,0),P(-w/2,d/2,0)]),fill:'rgba(50,12,28,.25)',filter:'url(#blur)'},slot);
    var bob=el('g',{},slot), blk=el('g',{},bob);
    return {slot:slot,shadow:sh,bob:bob,blk:blk};
  }
  function pill(parent,text,cx,cy,fill,color){
    var w=text.length*8.6+30,g=el('g',{},parent);
    el('rect',{x:cx-w/2,y:cy-17,width:w,height:34,rx:17,fill:fill},g);
    var t=el('text',{x:cx,y:cy+5,'text-anchor':'middle','font-size':15,'font-weight':700,fill:color},g); t.textContent=text;
    return g;
  }

  var world=$('world'), ui=$('ui');
  gsap.set(world,{x:648,y:410});

  /* ---- plataforma ---- */
  prism(world,{w:520,d:330,h:12,top:'#F2E9DE',left:'#E3D6C7',right:'#EBDFD1',stroke:'rgba(120,90,70,.08)'}).g.setAttribute('transform','translate('+P(5,0,0)[0]+','+P(5,0,0)[1]+')');

  /* ---- bloque modelo (carbón) ---- */
  var cS=slotFor(world,-80,0,200,220);
  var core=prism(cS.blk,{w:70,d:70,h:70,top:'#FFC2D1',left:'#E8708F',right:'#F0839F',stroke:'rgba(255,255,255,.6)'});
  gsap.set(core.g,{y:-40});
  var cb=prism(cS.blk,{w:200,d:220,h:150,top:'#58545E',left:'#2E2B33',right:'#3D3A43'});
  var glyph=el('g',{},cS.blk);
  (function(){
    var nodes=[[-60,100],[-20,60],[20,105],[50,70],[-40,35],[30,30]].map(function(n){var p=P(n[0],110,n[1]);return p});
    var links=[[0,1],[1,2],[2,3],[1,4],[3,5],[4,5]];
    links.forEach(function(l){el('line',{x1:nodes[l[0]][0],y1:nodes[l[0]][1],x2:nodes[l[1]][0],y2:nodes[l[1]][1],stroke:'rgba(255,255,255,.55)','stroke-width':2.2,'stroke-linecap':'round'},glyph)});
    nodes.forEach(function(n,i){el('circle',{cx:n[0],cy:n[1],r:i%2?5.5:7,fill:i===1?'#F0839F':'#fff'},glyph)});
  })();

  /* ---- bloque explicación (granate) ---- */
  var mS=slotFor(world,90,0,140,220);
  var mb=prism(mS.blk,{w:140,d:220,h:150,top:'#C2395F',left:'#7A1932',right:'#8B1D3B',stroke:'rgba(255,255,255,.18)'});
  (function(){
    var g=el('g',{},mS.blk);
    [[-34,125,56],[-34,100,38],[-34,75,46]].forEach(function(r){
      var a=P(r[0],110,r[1]),b=P(r[0]+r[2],110,r[1]);
      el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'rgba(255,225,232,.8)','stroke-width':6,'stroke-linecap':'round'},g);
    });
  })();

  /* ---- costura / conexión entre bloques ---- */
  var seamA=P(20,-110,162), seamB=P(20,110,162);
  var seamGlow=el('path',{d:'M'+seamA.join(' ')+' L'+seamB.join(' '),stroke:'#F0839F','stroke-width':12,'stroke-linecap':'round',fill:'none',filter:'url(#glow)',pathLength:100,'stroke-dasharray':100,'stroke-dashoffset':100},world);
  var seam=el('path',{d:'M'+seamA.join(' ')+' L'+seamB.join(' '),stroke:'#FFE3EA','stroke-width':4,'stroke-linecap':'round',fill:'none',pathLength:100,'stroke-dasharray':100,'stroke-dashoffset':100},world);
  var ring=el('ellipse',{cx:17,cy:-152,rx:46,ry:26,fill:'none',stroke:'#F0839F','stroke-width':4},world);
  var pulses=[];
  for(var i=0;i<6;i++) pulses.push(el('circle',{r:6,cx:0,cy:0,fill:'#fff'},world));

  /* ---- datos (esferas) ---- */
  var ORB=['#F0839F','#7FA7E8','#E9B949','#5DC9B2','#F0839F'], orbs=ORB.map(function(c){return el('circle',{r:14,fill:c,cx:0,cy:0},world)});

  /* ---- resultado ---- */
  var resG=el('g',{},world);
  prism(resG,{w:64,d:64,h:64,top:'#FFFFFF',left:'#E6DACB',right:'#F1E7DA',stroke:'rgba(120,90,70,.15)'});
  var badge=el('g',{},resG);
  el('circle',{cx:0,cy:-100,r:19,fill:'#2E2B33'},badge);
  el('path',{d:'M-9 -100 L-3 -93 L10 -108',stroke:'#fff','stroke-width':4,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},badge);

  /* ---- signo de pregunta ---- */
  var qm=el('text',{x:-69,y:-215,'text-anchor':'middle','font-size':150,'font-weight':800,fill:'#C2395F',style:"font-family:'Bricolage Grotesque',sans-serif"},world); qm.textContent='?';

  /* ---- etiquetas ---- */
  var lab1=pill(world,'Modelo de IA',-215,150,'#2E2B33','#fff');
  var lab2=pill(world,'Bloque de explicación',330,150,'#8B1D3B','#fff');

  /* ---- panel de barras (pantalla) ---- */
  var panel=el('g',{},ui);
  el('rect',{x:0,y:0,width:290,height:236,rx:22,fill:'#fff',filter:'url(#card)'},panel);
  var pt=el('text',{x:24,y:40,'font-size':15,'font-weight':700,fill:'#6C5B62'},panel); pt.textContent='PESO DE CADA DATO';
  var cx0=150, bars=[], BAR=[[96,'#E8708F',1],[70,'#E8708F',1],[30,'#E8708F',1],[42,'#7FA7E8',-1]];
  el('line',{x1:cx0,y1:62,x2:cx0,y2:212,stroke:'#CBBBB0','stroke-width':2},panel);
  BAR.forEach(function(b,i){
    var y=72+i*38;
    var r=el('rect',{x:b[2]>0?cx0:cx0,y:y,width:0,height:20,rx:10,fill:b[1]},panel); bars.push({r:r,w:b[0],s:b[2]});
  });
  gsap.set(panel,{x:36,y:150});
  var panelThread=el('path',{d:'M326 270 C380 270 400 300 448 330',fill:'none',stroke:'#E8708F','stroke-width':3,'stroke-dasharray':'8 8','stroke-linecap':'round',pathLength:100},ui);

  /* ---- burbujas de explicación (pantalla) ---- */
  function bubble(x,y,label,col,lines,mono){
    var g=el('g',{},ui);
    el('rect',{x:0,y:0,width:292,height:112,rx:22,fill:'#fff',filter:'url(#card)'},g);
    var lw=label.length*7.6+24;
    el('rect',{x:18,y:16,width:lw,height:24,rx:12,fill:col},g);
    var lt=el('text',{x:18+lw/2,y:33,'text-anchor':'middle','font-size':12.5,'font-weight':700,fill:'#fff'},g); lt.textContent=label.toUpperCase();
    lines.forEach(function(s,i){
      var t=el('text',{x:20,y:68+i*24,'font-size':mono?15:17,'font-weight':mono?500:500,fill:'#2A1620',style:mono?"font-family:'JetBrains Mono',monospace":''},g); t.textContent=s;
    });
    gsap.set(g,{x:x,y:y});
    return g;
  }
  var bub=[
    bubble(960,120,'Especialista','#2E2B33',['tamaño      +0.42','crecimiento +0.31'],true),
    bubble(960,256,'Experto del área','#8B1D3B',['Los factores clave apuntan','a un caso de bajo riesgo.']),
    bubble(960,392,'Cualquier persona','#C2395F',['Es de bajo riesgo porque el','caso es pequeño y estable.'])
  ];

  /* ---- personas (pantalla) ---- */
  var PEOPLE=[[110,'#F0839F',118],[200,'#7FA7E8',96],[290,'#E9B949',108],[1000,'#5DC9B2',104],[1090,'#B79AA5',120],[1180,'#C2395F',92]];
  var people=[], lines=[];
  PEOPLE.forEach(function(p){
    var ln=el('path',{d:'M'+p[0]+' '+(590-p[2]-30)+' Q'+((p[0]+648)/2)+' 300 648 380',fill:'none',stroke:'rgba(139,29,59,.28)','stroke-width':2.5,'stroke-dasharray':'6 8','stroke-linecap':'round',pathLength:100},ui);
    lines.push(ln);
  });
  PEOPLE.forEach(function(p){
    var g=el('g',{},ui), bh=p[2]*0.62;
    el('ellipse',{cx:0,cy:2,rx:34,ry:9,fill:'rgba(50,12,28,.16)'},g);
    el('rect',{x:-26,y:-bh,width:52,height:bh,rx:26,fill:p[1]},g);
    el('circle',{cx:0,cy:-bh-24,r:20,fill:p[1]},g);
    gsap.set(g,{x:p[0],y:590});
    people.push(g);
  });

  /* ---- título final ---- */
  var fin=el('text',{x:640,y:96,'text-anchor':'middle','font-size':58,'font-weight':800,fill:'#2A1620',style:"font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-1.2px"},ui);
  fin.textContent='Entiende por qué decide la IA.';

  /* ---- escena 5: qué se necesita ---- */
  function titleTxt(txt){var t=el('text',{x:640,y:84,'text-anchor':'middle','font-size':44,'font-weight':800,fill:'#2A1620',style:"font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-1px"},ui);t.textContent=txt;return t}
  var t2a=titleTxt('Para configurarlo necesitas'), t2b=titleTxt('Luego, agrega tus casos');
  var cfg=[
    bubble(44,150,'Modelo','#2E2B33',['Sus pesos, en formato','.pkl o .joblib']),
    bubble(44,282,'Datos','#4F78C4',['Una parte del conjunto','de datos (CSV o XLSX)']),
    bubble(44,414,'Conocimiento','#C2395F',['Documentos de tu área','(PDF, DOCX o TXT)'])
  ];
  var FLY=[['#2E2B33',206,598,298],['#4F78C4',338,598,298],['#C2395F',470,704,326]];
  var fly=FLY.map(function(f){return el('circle',{r:10,cx:0,cy:0,fill:f[0]},ui)});
  var okPill=pill(ui,'Sistema configurado',648,128,'#8B1D3B','#fff');
  function caseCard(n,sub,x,y){
    var g=el('g',{},ui);
    el('rect',{x:0,y:0,width:262,height:64,rx:18,fill:'#fff',filter:'url(#card)'},g);
    el('circle',{cx:34,cy:32,r:17,fill:'#2E2B33'},g);
    var a=el('text',{x:34,y:38,'text-anchor':'middle','font-size':15,'font-weight':700,fill:'#fff'},g);a.textContent=n;
